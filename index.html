<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <article>
      <figure class="product-image-container">
        <img class="product-image-desktop" src="/images/image-product-desktop.jpg" alt="bottle of gabrielle chanelle perfume surrounded by branches with leaves">
        <img class="product-image-mobile" src="/images/image-product-mobile.jpg" alt="bottle of gabrielle chanelle perfume surrounded by branches with leaves">
      </figure>
      <section class="product-info-container">
        <h1>PERFUME</h1>
        <h2>Gabrielle Essence Eau De Parfum</h2>
        <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        <div class="price-container">
          <span class="discount-price">$149.99</span>
          <div class="original-price-container">
            <span class="original-price">$169.99</span>
          </div>
        </div>
        <button type="button" class="add-to-cart-btn">
          <img class="add-to-cart-icon-img" src="/images/icon-cart.svg" alt="Shopping cart icon">
          Add to Cart
        </button>
      </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="#">Mellow</a>.
  </footer>
</body>
</html>
